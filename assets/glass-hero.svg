<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chetan Awari profile hero</title>
  <desc id="desc">A dark glassmorphism profile banner for Chetan Awari, software developer focused on Kotlin, Java, data structures, Android, and backend APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1130" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.38" stop-color="#2A0D25"/>
      <stop offset="0.74" stop-color="#13213D"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="180" y1="76" x2="1060" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="125" y1="372" x2="1020" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#EC4899" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="glass" x1="300" y1="58" x2="910" y2="383" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge" x1="296" y1="70" x2="914" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <path d="M-35 320C168 210 342 198 565 120C783 44 976 58 1235 132L1235 250C1006 188 801 206 610 282C391 368 167 398 -35 376V320Z" fill="url(#ribbonA)" opacity="0.72" filter="url(#soft)"/>
  <path d="M-10 92C205 164 360 74 552 88C789 105 914 271 1215 235V348C942 384 748 260 540 240C306 218 183 314 -10 224V92Z" fill="url(#ribbonB)" opacity="0.58" filter="url(#soft)"/>
  <path d="M86 368L338 48L514 54L240 386L86 368Z" fill="#F472B6" opacity="0.12"/>
  <path d="M780 43L1110 172L1110 318L710 157L780 43Z" fill="#67E8F9" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="248" y="66" width="704" height="288" rx="30" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.4"/>
    <rect x="270" y="88" width="660" height="244" rx="24" fill="#FFFFFF" opacity="0.035"/>
    <path d="M300 152H900" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M300 265H900" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <g opacity="0.96">
    <text x="600" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">Chetan Awari</text>
    <text x="600" y="190" text-anchor="middle" fill="#D8F3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Software Developer | Kotlin | Java | Data Structures</text>
    <text x="600" y="228" text-anchor="middle" fill="#FCE7F3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Building practical software with clean logic, reliable APIs, and product-minded engineering.</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="338" y="286" width="124" height="34" rx="17" fill="#020617" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="400" y="308" text-anchor="middle" fill="#BAE6FD">Android</text>
    <rect x="478" y="286" width="124" height="34" rx="17" fill="#020617" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="540" y="308" text-anchor="middle" fill="#BBF7D0">Backend APIs</text>
    <rect x="618" y="286" width="124" height="34" rx="17" fill="#020617" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="680" y="308" text-anchor="middle" fill="#FBCFE8">DSA</text>
    <rect x="758" y="286" width="124" height="34" rx="17" fill="#020617" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="820" y="308" text-anchor="middle" fill="#FED7AA">Open to Work</text>
  </g>

  <rect width="1200" height="420" rx="28" filter="url(#grain)" opacity="0.35"/>
</svg>
