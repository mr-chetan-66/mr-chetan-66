<svg width="1100" height="330" viewBox="0 0 1100 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chetan Awari engineering focus board</title>
  <desc id="desc">Three glassmorphism focus cards showing app development, problem solving, and backend learning.</desc>
  <defs>
    <linearGradient id="boardBg" x1="32" y1="24" x2="1048" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.38" stop-color="#39112E"/>
      <stop offset="0.7" stop-color="#12343B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="sweep" x1="40" y1="286" x2="1054" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316" stop-opacity="0.75"/>
      <stop offset="0.42" stop-color="#EC4899" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="glass" x1="98" y1="74" x2="344" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="blur" x="-18%" y="-28%" width="136%" height="156%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1100" height="330" rx="24" fill="url(#boardBg)"/>
  <path d="M-26 250C172 188 312 76 522 100C756 126 838 244 1126 156V258C910 338 704 250 518 228C326 206 174 292 -26 304V250Z" fill="url(#sweep)" opacity="0.72" filter="url(#blur)"/>
  <path d="M60 72L280 35L456 295L246 305L60 72Z" fill="#FFFFFF" opacity="0.055"/>
  <path d="M678 32L1040 94L998 278L632 210L678 32Z" fill="#FFFFFF" opacity="0.052"/>

  <g filter="url(#cardShadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="74" width="294" height="182" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.34"/>
    <text x="102" y="124" fill="#FFFFFF" font-size="24" font-weight="800">App Builder</text>
    <text x="102" y="158" fill="#D8F3FF" font-size="16" font-weight="600">Kotlin, Java, Android</text>
    <text x="102" y="195" fill="#F8FAFC" font-size="15">Practical utilities, portals, and</text>
    <text x="102" y="219" fill="#F8FAFC" font-size="15">mobile workflows with clean UI logic.</text>
    <rect x="102" y="226" width="112" height="4" rx="2" fill="#22D3EE"/>

    <rect x="403" y="74" width="294" height="182" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.34"/>
    <text x="435" y="124" fill="#FFFFFF" font-size="24" font-weight="800">Problem Solver</text>
    <text x="435" y="158" fill="#FBCFE8" font-size="16" font-weight="600">DSA, patterns, interviews</text>
    <text x="435" y="195" fill="#F8FAFC" font-size="15">Breaking rough problems into</text>
    <text x="435" y="219" fill="#F8FAFC" font-size="15">simple structures and dependable code.</text>
    <rect x="435" y="226" width="112" height="4" rx="2" fill="#FB7185"/>

    <rect x="736" y="74" width="294" height="182" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.34"/>
    <text x="768" y="124" fill="#FFFFFF" font-size="24" font-weight="800">API Learner</text>
    <text x="768" y="158" fill="#BBF7D0" font-size="16" font-weight="600">FastAPI, services, system design</text>
    <text x="768" y="195" fill="#F8FAFC" font-size="15">Growing backend instincts through</text>
    <text x="768" y="219" fill="#F8FAFC" font-size="15">small services and clear contracts.</text>
    <rect x="768" y="226" width="112" height="4" rx="2" fill="#34D399"/>
  </g>
</svg>
